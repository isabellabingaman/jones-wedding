  <link

    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Upright:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400&display=swap"
    rel="stylesheet"
  />


  <style>


    /* ─────────────────────────────────────────────
       RESET
    ───────────────────────────────────────────── */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }



    /* ─────────────────────────────────────────────
       ABRAMA SERIF
    ───────────────────────────────────────────── */

    @font-face {
      font-family: 'Abrama Serif';
      src: url('assets/fonts/AbramaSerif-Regular.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
    }



    /* ─────────────────────────────────────────────
       COLORS + FONTS
    ───────────────────────────────────────────── */

    :root {
      --cream: #fdf9f5;
      --white: #ffffff;
      --navy: #3b1f2b;

      --blue: #7a3b3b;
      --blue-lt: #a05c4a;

      --lilac: #8b3a52;
      --blush: #c47a5a;
      --sage: #6b7c41;
      --yellow: #d4845a;
      --gold: #b85c38;

      --font-display: 'Abrama Serif', serif;
      --font-serif: 'Cormorant Upright', serif;
      --font-body: 'Jost', sans-serif;
    }



    html {
      scroll-behavior: smooth;
    }



    body {
      background-color: var(--cream);
      color: var(--navy);

      font-family: var(--font-body);
      font-weight: 300;

      overflow-x: hidden;
      min-height: 100vh;
    }



    /* ─────────────────────────────────────────────
       WINERY BACKGROUND
    ───────────────────────────────────────────── */

    body::before {
      content: '';

      position: fixed;
      inset: 0;

      background-image: url('assets/images/BGDesign7.jpg');
      background-repeat: repeat;
      background-size: 800px;

      opacity: 0.42;

      z-index: 0;
      pointer-events: none;
    }



    /* ─────────────────────────────────────────────
       NAVIGATION
    ───────────────────────────────────────────── */

    nav {
      position: fixed;

      top: 0;
      left: 0;
      right: 0;

      z-index: 100;

      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;

      gap: 2rem;

      padding: 1.4rem 1.5rem;

      background:
        linear-gradient(
          to bottom,
          rgba(253, 249, 245, 0.94) 60%,
          transparent
        );

      font-family: var(--font-body);

      font-size: 0.68rem;
      font-weight: 400;

      letter-spacing: 0.16em;
      text-transform: uppercase;
    }



    nav a {
      color: var(--navy);

      text-decoration: none;
      white-space: nowrap;

      transition: opacity 0.2s ease;
    }



    nav a:hover {
      opacity: 0.5;
    }



    /* ─────────────────────────────────────────────
       PAGE
    ───────────────────────────────────────────── */

    .page {
      position: relative;
      z-index: 1;

      padding-top: 8rem;
      padding-bottom: 6rem;
    }



    /* ─────────────────────────────────────────────
       PAGE HEADER
    ───────────────────────────────────────────── */

    .page-header {
      position: relative;

      text-align: center;

      margin-bottom: 4rem;
      padding: 0 2rem;
    }



    /* Decorative top border */

    .page-header::before {
      content: '';

      position: fixed;

      top: 0;
      left: 0;
      right: 0;

      height: 6px;

      background:
        linear-gradient(
          90deg,
          var(--lilac),
          var(--blue),
          var(--blush),
          var(--yellow),
          var(--blue-lt),
          var(--sage),
          var(--lilac)
        );

      z-index: 101;
    }



    .eyebrow {
      font-family: var(--font-body);

      font-size: 0.65rem;
      font-weight: 400;

      letter-spacing: 0.3em;
      text-transform: uppercase;

      color: var(--navy);

      margin-bottom: 2rem;

      opacity: 0;

      animation:
        fadeUp 0.8s 0.2s forwards;
    }



    .page-header h1 {
      font-family: var(--font-display);

      font-size:
        clamp(3.5rem, 9vw, 6.5rem);

      font-weight: normal;

      line-height: 1;

      color: var(--navy);

      opacity: 0;

      animation:
        fadeUp 0.9s 0.4s forwards;
    }



    /* ─────────────────────────────────────────────
       GALLERY
    ───────────────────────────────────────────── */

    .gallery-wrap {
      max-width: 1200px;

      margin: 0 auto;

      padding: 0 2rem;
    }



    .masonry {
      columns: 3;

      column-gap: 1rem;
    }



    .masonry-item {
      break-inside: avoid;

      margin-bottom: 1rem;

      overflow: hidden;

      border-radius: 4px;

      opacity: 0;

      animation:
        fadeUp 0.7s forwards;

      cursor: pointer;
    }



    /* Stagger photos */

    .masonry-item:nth-child(1) {
      animation-delay: 0.3s;
    }

    .masonry-item:nth-child(2) {
      animation-delay: 0.4s;
    }

    .masonry-item:nth-child(3) {
      animation-delay: 0.5s;
    }

    .masonry-item:nth-child(4) {
      animation-delay: 0.55s;
    }

    .masonry-item:nth-child(5) {
      animation-delay: 0.6s;
    }

    .masonry-item:nth-child(6) {
      animation-delay: 0.65s;
    }

    .masonry-item:nth-child(7) {
      animation-delay: 0.7s;
    }

    .masonry-item:nth-child(8) {
      animation-delay: 0.75s;
    }

    .masonry-item:nth-child(9) {
      animation-delay: 0.8s;
    }

    .masonry-item:nth-child(10) {
      animation-delay: 0.85s;
    }



    .masonry-item img {
      width: 100%;

      display: block;

      transition:
        transform 0.5s ease,
        filter 0.4s ease;

      filter: brightness(0.97);
    }



    .masonry-item:hover img {
      transform: scale(1.02);

      filter: brightness(1.03);
    }



    /* ─────────────────────────────────────────────
       LIGHTBOX
    ───────────────────────────────────────────── */

    .lightbox {
      display: none;

      position: fixed;
      inset: 0;

      z-index: 200;

      background: rgba(0, 0, 0, 0.88);

      align-items: center;
      justify-content: center;

      cursor: pointer;

      padding: 2rem;
    }



    .lightbox.open {
      display: flex;
    }



    .lightbox img {
      max-width: 90vw;
      max-height: 90vh;

      object-fit: contain;

      box-shadow:
        0 20px 80px rgba(0, 0, 0, 0.6);
    }



    .lightbox-close {
      position: absolute;

      top: 1.5rem;
      right: 2rem;

      color: rgba(255, 255, 255, 0.7);

      font-family: var(--font-body);

      font-size: 0.65rem;

      letter-spacing: 0.2em;

      text-transform: uppercase;

      cursor: pointer;

      transition: color 0.2s ease;
    }



    .lightbox-close:hover {
      color: white;
    }



    /* ─────────────────────────────────────────────
       FOOTER
    ───────────────────────────────────────────── */

    footer {
      position: relative;
      z-index: 1;

      text-align: center;

      padding: 2.5rem 2rem;

      border-top:
        1px solid rgba(59, 31, 43, 0.08);

      font-family: var(--font-body);

      font-size: 0.58rem;
      font-weight: 400;

      letter-spacing: 0.18em;

      text-transform: uppercase;

      color: var(--navy);

      opacity: 0.4;
    }



    /* ─────────────────────────────────────────────
       ANIMATION
    ───────────────────────────────────────────── */

    @keyframes fadeUp {

      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }



    /* ─────────────────────────────────────────────
       TABLET
    ───────────────────────────────────────────── */

    @media (max-width: 900px) {

      .masonry {
        columns: 2;
      }


      nav {
        gap: 0.8rem 1.4rem;

        font-size: 0.6rem;

        letter-spacing: 0.12em;
      }

    }



    /* ─────────────────────────────────────────────
       MOBILE
    ───────────────────────────────────────────── */

    @media (max-width: 600px) {

      nav {
        gap: 0.65rem 1rem;

        padding: 1rem 0.7rem;

        font-size: 0.52rem;

        letter-spacing: 0.10em;
      }


      .page {
        padding-top: 8rem;
      }


      .page-header {
        margin-bottom: 3rem;
      }


      .gallery-wrap {
        padding: 0 1rem;
      }


      .masonry {
        columns: 1;
      }


      .lightbox {
        padding: 1rem;
      }


      .lightbox-close {
        top: 1rem;
        right: 1rem;
      }

    }


  </style>

</head>

  <!-- ─────────────────────────────────────────────
       LIGHTBOX SCRIPT
  ───────────────────────────────────────────── -->

  <script>


    function openLightbox(src) {

      document
        .getElementById('lightbox-img')
        .src =
        src;


      document
        .getElementById('lightbox')
        .classList
        .add('open');


      document.body.style.overflow =
        'hidden';

    }



    function closeLightbox() {

      document
        .getElementById('lightbox')
        .classList
        .remove('open');


      document.body.style.overflow =
        '';

    }



    document.addEventListener(
      'keydown',
      function(event) {

        if (event.key === 'Escape') {

          closeLightbox();

        }

      }
    );


  </script>
